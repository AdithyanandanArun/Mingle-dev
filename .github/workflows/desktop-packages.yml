name: Build desktop packages

# Builds downloadable workflow artifacts. Creating a public release or AUR entry remains manual.
on:
  workflow_dispatch:
    inputs:
      include_arch:
        description: Also build the Arch package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:deb
      - name: Validate Debian metadata and extracted runtime
        run: |
          dpkg-deb --info release/*.deb
          dpkg-deb --contents release/*.deb > release/debian-contents.txt
          grep -E '^-rwsr-xr-x root/root .*opt/mingle/chrome-sandbox$' release/debian-contents.txt
          dpkg-deb --extract release/*.deb release/debian-extracted
          node scripts/smoke-packaged-linux.mjs release/debian-extracted/opt/mingle
      - name: Verify installation, launcher and removal in disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y ./release/*.deb
          test -x /usr/bin/mingle && grep -q "exec /opt/mingle/mingle" /usr/bin/mingle
          test "$(stat -c '%u:%g:%a' /opt/mingle/chrome-sandbox)" = '0:0:4755'
          node scripts/smoke-packaged-linux.mjs /opt/mingle
          xvfb-run -a node scripts/smoke-desktop.mjs /opt/mingle/mingle
          mkdir -p "$HOME/.config/Mingle"
          echo keep > "$HOME/.config/Mingle/package-check"
          sudo apt-get remove -y mingle
          test -f "$HOME/.config/Mingle/package-check"
          test ! -e /usr/bin/mingle
      - uses: actions/upload-artifact@v4
        with:
          name: mingle-linux-x64
          compression-level: 0
          retention-days: 7
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.deb
            release/*.deb.sha256

  arch:
    if: ${{ inputs.include_arch }}
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install packaging tools in the disposable container
        run: pacman -Syu --noconfirm --needed nodejs git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mingle-linux-x64
          path: release
      - name: Build Arch package as an ordinary user
        run: |
          useradd --create-home minglebuild
          chown -R minglebuild:minglebuild "$GITHUB_WORKSPACE"
          runuser -u minglebuild -- node scripts/package-arch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mingle-arch-x86_64
          compression-level: 0
          path: |
            release/*.pkg.tar.zst
            release/*.pkg.tar.zst.sha256
            release/arch-build/PKGBUILD

name: Validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check desktop invitation links, landing page and email submission
        run: node --experimental-strip-types --test apps/desktop/project-invitation.test.mjs apps/desktop/browser-preload.test.cjs website/join/join.test.mjs supabase/functions/_shared/gmail-smtp.test.mjs supabase/functions/project-invitation-delivery.test.mjs
      - name: Check desktop encrypted account storage
        run: node --test apps/desktop/account-storage/*.test.mjs apps/desktop/shell-environment.test.mjs
      - name: Check embedded browser relay and isolation
        run: node --test apps/desktop/embedded-browser/*.test.mjs
      - run: pnpm typecheck
      # Multi-app acceptance starts real Git, SQLite and encrypted transport fixtures.
      # Run files serially on the shared runner, matching the verified local suite.
      - run: pnpm --filter @mingle/server exec vitest run --maxWorkers=1
      - name: Check web state and progress models
        run: pnpm --filter @mingle/web exec vitest run --maxWorkers=1
      - run: pnpm build
      - run: pnpm smoke
